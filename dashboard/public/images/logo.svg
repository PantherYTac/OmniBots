<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#5865F2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Hexagonal / Orbital Nodes Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagonal Orbital Ring -->
    <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="none" stroke="url(#omniGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#glow)"/>
    
    <!-- Inner Interlocking Geometric Lattice -->
    <path d="M50 5 L50 95 M10 28 L90 72 M10 72 L90 28" fill="none" stroke="#1E2538" stroke-width="2.5" opacity="0.6"/>
    <polygon points="50,25 72,38 72,62 50,75 28,62 28,38" fill="rgba(88, 101, 242, 0.15)" stroke="url(#omniGrad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Central Power Core -->
    <circle cx="50" cy="50" r="10" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="4.5" fill="#FFFFFF"/>
    
    <!-- Satellite Orbital Nodes -->
    <circle cx="50" cy="5" r="5" fill="#38BDF8"/>
    <circle cx="90" cy="28" r="5" fill="#5865F2"/>
    <circle cx="90" cy="72" r="5" fill="#38BDF8"/>
    <circle cx="50" cy="95" r="5" fill="#5865F2"/>
    <circle cx="10" cy="72" r="5" fill="#38BDF8"/>
    <circle cx="10" cy="28" r="5" fill="#5865F2"/>
  </g>

  <!-- Typography: OmniBots -->
  <text x="130" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-0.03em">
    Omni<tspan fill="url(#omniGrad)">Bots</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="132" y="94" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="0.2em">
    MULTI-BOT ORCHESTRATION ENGINE
  </text>
</svg>
