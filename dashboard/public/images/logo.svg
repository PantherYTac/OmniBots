<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" width="100%" height="100%">
  <defs>
    <!-- Premium Blurple to Cyan linear gradient -->
    <linearGradient id="omniBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Text gradient for 'Bots' -->
    <linearGradient id="omniTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Subtle icon drop shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5865F2" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Icon Mark: Modern Hex-Curved Bot Core (38x38 centered in 48h) -->
  <g transform="translate(5, 5)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#omniBrandGrad)" filter="url(#iconShadow)" />

    <!-- Subtle Inner Glow / Highlight border -->
    <rect x="0.75" y="0.75" width="36.5" height="36.5" rx="9.25" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.2" />

    <!-- Minimalist Robot Visor & Multi-Node Lattice -->
    <!-- Sleek horizontal visor bar -->
    <rect x="9" y="14" width="20" height="4.5" rx="2.25" fill="#FFFFFF" />

    <!-- Twin glowing camera / sensor apertures -->
    <circle cx="14" cy="16.25" r="1.3" fill="#0B0E14" />
    <circle cx="24" cy="16.25" r="1.3" fill="#0B0E14" />

    <!-- Constellation Node Links (representing multi-bot network) -->
    <line x1="14" y1="22" x2="24" y2="22" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.4" stroke-linecap="round" />
    <line x1="19" y1="22" x2="19" y2="28" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.4" stroke-linecap="round" />

    <circle cx="14" cy="22" r="1.8" fill="#FFFFFF" />
    <circle cx="24" cy="22" r="1.8" fill="#FFFFFF" />
    <circle cx="19" cy="28" r="1.8" fill="#FFFFFF" />

    <!-- Tiny satellite top pulse -->
    <circle cx="19" cy="9.5" r="1.2" fill="rgba(255, 255, 255, 0.75)" />
  </g>

  <!-- Typography: OmniBots -->
  <g transform="translate(54, 33)">
    <text
      x="0"
      y="0"
      font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="27"
      font-weight="800"
      letter-spacing="-0.035em"
      fill="#FFFFFF"
    >Omni<tspan fill="url(#omniTextGrad)" font-weight="800">Bots</tspan></text>
  </g>
</svg>
