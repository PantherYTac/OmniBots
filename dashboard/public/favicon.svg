<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Clean dark backdrop with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0B0E14" />

  <!-- Gradient Squircle Core (24x24 centered at 4,4) -->
  <rect x="4" y="4" width="24" height="24" rx="6.5" fill="url(#favBrandGrad)" />
  <rect x="4.5" y="4.5" width="23" height="23" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="0.8" />

  <!-- Iconic Visor & Nodes (Centered) -->
  <!-- Visor bar -->
  <rect x="9.5" y="11.5" width="13" height="3.2" rx="1.6" fill="#FFFFFF" />
  <circle cx="12.5" cy="13.1" r="0.9" fill="#0B0E14" />
  <circle cx="19.5" cy="13.1" r="0.9" fill="#0B0E14" />

  <!-- Network nodes -->
  <line x1="12.5" y1="18.5" x2="19.5" y2="18.5" stroke="rgba(255, 255, 255, 0.55)" stroke-width="1.1" stroke-linecap="round" />
  <line x1="16" y1="18.5" x2="16" y2="22.5" stroke="rgba(255, 255, 255, 0.55)" stroke-width="1.1" stroke-linecap="round" />

  <circle cx="12.5" cy="18.5" r="1.4" fill="#FFFFFF" />
  <circle cx="19.5" cy="18.5" r="1.4" fill="#FFFFFF" />
  <circle cx="16" cy="22.5" r="1.4" fill="#FFFFFF" />
</svg>
